<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supraja & Logesh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         OPENING — THE KNOT
         ========================================== -->

    <main class="opening" id="opening">

        <div class="invitation">

            <div class="ornament">✦</div>

            <p class="invitation-label">
                A WEDDING INVITATION
            </p>

            <div class="names">

                <span>SUPRAJA</span>

                <small>&</small>

                <span>LOGESH</span>

            </div>

            <div class="date">
                15 NOVEMBER 2026
            </div>


            <!-- ==================================
                 WRAPPING THREAD
                 ================================== -->

            <div class="thread-area">

                <div class="thread horizontal"></div>

                <div class="thread vertical"></div>


                <!-- The knot -->

                <button
                    class="knot"
                    id="knot"
                    aria-label="Untie the invitation"
                    type="button"
                >

                    <span class="knot-loop"></span>

                    <span class="knot-loop second"></span>

                    <span class="knot-center"></span>

                </button>


                <!-- Loose thread -->

                <div
                    class="thread-tail"
                    id="threadTail"
                ></div>

            </div>


            <p class="instruction">
                PULL THE THREAD TO UNVEIL
            </p>

            <p class="hint">
                Drag the knot
            </p>

        </div>

    </main>


    <script src="script.js?v=2"></script>

</body>
</html>
